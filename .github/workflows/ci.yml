name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Typecheck (test-plan §3 faza 3): ta sama komenda co w hooku pre-push.
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Dowody gwarancji bazodanowych (test-plan §3 faza 1): sam Postgres z migracjami
  # i seedem, potem skrypty z supabase/tests/. Rownolegle do `ci`; oba sa wymaganymi
  # checkami w rulesecie `main` (test-plan §6.6).
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ten sam obraz Postgresa co lokalnie. CLI czyta tag z supabase/.temp/postgres-version
      # (plik gitignored, lokalnie zapisany przez `supabase link`); bez niego bierze swoj
      # domyslny tag - w pierwszym runie 17.6.1.106 padl ("database system is in recovery
      # mode") na bloku `set local role anon` w rls_isolation.sql, ktory na 17.6.1.147
      # przechodzi. Zrodlo prawdy to commitowany supabase/postgres-version - po zmianie
      # wersji lokalnie (po `supabase link`) zaktualizuj ten plik, nie ten workflow.
      - run: mkdir -p supabase/.temp && cp supabase/postgres-version supabase/.temp/postgres-version
      - run: npx supabase db start
      - run: npm run test:db
        env:
          # Dluzsza bariera w skrypcie wspolbieznosci: zimny runner spawnuje psql wolniej.
          BARRIER_SECONDS: "1"
      # Przy porazce log Postgresa z kontenera - bez niego crash bazy (np. "database
      # system is in recovery mode") jest nie do zdiagnozowania z samego wyjscia psql.
      # Nazwa kontenera z project_id w config.toml, tak jak w supabase/tests/_psql.sh.
      - if: failure()
        run: docker logs --tail 300 "supabase_db_$(sed -nE 's/^project_id *= *"(.*)".*/\1/p' supabase/config.toml)"

  # Petla jezdzca w przegladarce (test-plan §3 faza 2): Playwright przeciwko lokalnemu
  # stackowi Supabase i `astro preview`. `supabase db start` z joba db-tests to sam
  # Postgres - bez GoTrue nie ma logowania - wiec tu startuje pelny stack, okrojony
  # do kong + gotrue + postgrest (reszta uslug to zbedne obrazy na zimnym runnerze).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ten sam obraz Postgresa co lokalnie - uzasadnienie przy jobie db-tests.
      - run: mkdir -p supabase/.temp && cp supabase/postgres-version supabase/.temp/postgres-version
      - run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Sekrety czyta ZBUDOWANY worker ze snapshotu dist/server/.dev.vars, ktory
      # `astro build` robi z glownego .dev.vars - zmienne srodowiskowe procesu do
      # workera nie docieraja. Plik musi wiec istniec PRZED buildem, ktory odpala
      # webServer Playwrighta. Klucz anon lokalnego stacku nie jest sekretem.
      - run: |
          ANON_KEY=$(npx supabase status -o env | sed -nE 's/^ANON_KEY="?([^"]*)"?$/\1/p')
          test -n "$ANON_KEY"
          printf 'SUPABASE_URL=http://127.0.0.1:54321\nSUPABASE_KEY=%s\n' "$ANON_KEY" > .dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Przy porazce logi auth i bazy - bez nich timeout logowania w setupie jest
      # nie do odroznienia od padnietego GoTrue.
      - if: failure()
        run: |
          PROJECT=$(sed -nE 's/^project_id *= *"(.*)".*/\1/p' supabase/config.toml)
          docker logs --tail 200 "supabase_auth_$PROJECT" || true
          docker logs --tail 200 "supabase_db_$PROJECT" || true

  # Brak joba deploy (test-plan §3 faza 3, decyzja 2026-09-09): produkcje wdraza wylacznie
  # Cloudflare Workers Builds z galezi `main` (integracja Git w panelu). Bramka produkcji
  # to ruleset na `main`: na main laduje tylko merge PR-a z zielonymi `ci`, `db-tests`,
  # `e2e`; push bezposredni jest odrzucany. Sekrety Cloudflare w GitHub Secrets sa juz nieuzywane.
